<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Tip calculator app</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>SPLI<br />TTER</h1>
    </header>
    <main>
      <div class="calculator-wrapper">
        <form is="form">
          <label for="bill">Bill</label>
          <div class="bill-input-container">
            <img src="./images/icon-dollar.svg" alt="" />
            <input type="text" name="bill" id="bill" inputmode="numeric" />
          </div>
          <div class="tip-btn-wrapper">
            <label for="">Select Tip %</label>
            <div class="button-wrapper">
              <button type="button" class="tipBtn" value="5">5%</button>
              <button type="button" class="tipBtn" value="10">10%</button>
              <button type="button" class="tipBtn" value="15">15%</button>
              <button type="button" class="tipBtn" value="25">25%</button>
              <button type="button" class="tipBtn" value="50">50%</button>
              <input
                id="customInput"
                class="custom"
                type="text"
                inputmode="numeric"
                placeholder="Custom"
              />
            </div>
          </div>
          <label for="people">Number of People</label>
          <div class="people-input-container">
            <img src="./images/icon-person.svg" alt="" />
            <input
              class="people-input"
              type="text"
              name="people"
              id="peopleInput"
              type="number"
            />
          </div>
        </form>
        <div class="totals-container">
          <div class="amount-wrapper">
            <div class="amount-text-wrapper">
              <h2>Tip Amount</h2>
              <p>/ person</p>
            </div>
            <p class="currency">£<span id="totalTip"></span></p>
          </div>
          <div class="amount-wrapper">
            <div class="amount-text-wrapper">
              <h2>Total</h2>
              <p>/ person</p>
            </div>
            <p class="currency">£<span id="totalBill"></span></p>
          </div>
          <button id="resetBtn" class="reset-btn">RESET</button>
        </div>
      </div>
    </main>
  </body>
</html>
