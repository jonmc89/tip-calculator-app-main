<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Tip calculator app</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>SPLI<br />TTER</h1>
    </header>
    <main>
      <div class="calculator-wrapper">
        <form>
          <label for="bill">Bill</label>
          <input type="text" name="bill" id="bill" inputmode="numeric" />
          <div class="tip-btn-wrapper">
            <label for="">Select Tip %</label>
            <div class="button-wrapper">
              <button>5%</button>
              <button>10%</button>
              <button>15%</button>
              <button>25%</button>
              <button>50%</button>
              <input
                class="custom"
                type="text"
                inputmode="numeric"
                placeholder="Custom"
              />
            </div>
          </div>
          <label for="people">Number of People</label>
          <input
            class="people-input"
            type="text"
            name="people"
            id="people"
            type="number"
          />
        </form>
        <div class="totals-container">
          <div class="amount-wrapper">
            <div class="amount-text-wrapper">
              <h2>Tip Amount</h2>
              <p>/ person</p>
            </div>
            <span>$4.27</span>
          </div>
          <div class="amount-wrapper">
            <div class="amount-text-wrapper">
              <h2>Total</h2>
              <p>/ person</p>
            </div>
            <span>$32.79</span>
          </div>
          <button class="reset-btn">RESET</button>
        </div>
      </div>
    </main>
  </body>
</html>
